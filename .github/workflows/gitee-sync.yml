# GitHub Release 正式发布（Publish）后，把更新资产同步到 Gitee 固定 release（tag: updater），
# 作为国内备用更新源（updater endpoints 按序回退，见 tauri.conf.json）。
# Draft 阶段不同步，避免用户先于人工冒烟收到更新推送。
# 也支持手动 dispatch 补同步（输入 GitHub release tag）。

name: Gitee Sync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 GitHub release tag（如 v0.9.10）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-sync
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  sync:
    name: 同步更新资产到 Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 手动 dispatch 允许不带 v 前缀（如 0.9.11），统一补全为 v0.9.11
      - name: Resolve tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          [[ "$TAG" != v* ]] && TAG="v$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # 同步脚本属于发布基础设施，始终用 master 最新版（不能 checkout 发布 tag——tag 里可能是旧脚本）
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 全量下载（Tauri v2 NSIS 更新包是 -setup.exe + .sig，独立 exe 也会被带下来，脚本只挑 latest.json 引用的文件）
      - name: Download updater assets from GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber
          ls -la assets

      - name: Sync assets to Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node scripts/sync-gitee-release.mjs assets
