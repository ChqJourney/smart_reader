<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1740" viewBox="0 0 1600 1740" role="img" aria-labelledby="title desc">
  <title id="title">SpecReader AI 记忆系统架构</title>
  <desc id="desc">本地优先、证据驱动、按需召回的用户记忆系统，包括记忆产生、三层存储、意图消歧、原文查证、记忆生成与提示词编排时机和用户控制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .section-title { font-size: 23px; font-weight: 700; fill: #0F172A; }
      .card-title { font-size: 20px; font-weight: 700; fill: #0F172A; }
      .body { font-size: 16px; fill: #334155; }
      .small { font-size: 14px; fill: #475569; }
      .tiny { font-size: 13px; fill: #64748B; }
      .white { fill: #FFFFFF; }
      .blue { fill: #2563EB; }
      .green { fill: #047857; }
      .amber { fill: #B45309; }
      .red { fill: #B91C1C; }
      .bold { font-weight: 700; }
      .center { text-anchor: middle; }
      .arrow { fill: none; stroke: #2563EB; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .arrow-gray { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrowGray); }
    </style>
  </defs>

  <rect width="1600" height="1740" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="36" y="28" width="1528" height="112" rx="22" fill="url(#header)" filter="url(#shadow)"/>
  <text x="72" y="76" class="white" font-size="32" font-weight="750">SpecReader AI 记忆系统</text>
  <text x="72" y="111" fill="#DBEAFE" font-size="18">目标：在用户表达不清时，借助可靠记忆判断意图，而不是把全部聊天历史塞给模型</text>
  <g transform="translate(1160,58)">
    <rect width="364" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.13" stroke="#BFDBFE" stroke-opacity="0.45"/>
    <text x="182" y="31" class="white center" font-size="17" font-weight="650">本地优先 · 证据驱动 · 可解释可撤回</text>
  </g>

  <!-- Priority rule -->
  <rect x="36" y="158" width="1528" height="64" rx="15" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#shadow)"/>
  <text x="64" y="197" class="body bold">判断优先级</text>
  <text x="194" y="197" font-size="17" fill="#1E40AF" font-weight="700">本次明确指令</text>
  <text x="330" y="197" class="body">›</text>
  <text x="360" y="197" font-size="17" fill="#334155">当前选区 / 文档 / 会话</text>
  <text x="570" y="197" class="body">›</text>
  <text x="600" y="197" font-size="17" fill="#047857">用户确认的长期偏好</text>
  <text x="790" y="197" class="body">›</text>
  <text x="820" y="197" font-size="17" fill="#B45309">行为推断的习惯</text>
  <text x="974" y="197" class="body">›</text>
  <text x="1004" y="197" font-size="17" fill="#64748B">应用默认行为</text>
  <rect x="1230" y="174" width="302" height="32" rx="16" fill="#ECFDF5"/>
  <text x="1381" y="196" class="green center small bold">标准事实始终以 PDF 原文为准</text>

  <!-- Section 1 -->
  <text x="48" y="260" class="section-title">01　记忆如何产生与保存</text>

  <!-- Signals -->
  <rect x="48" y="282" width="300" height="306" rx="18" fill="#FFFFFF" stroke="#BFDBFE" filter="url(#shadow)"/>
  <rect x="48" y="282" width="300" height="52" rx="18" fill="#EFF6FF"/>
  <path d="M48 316 H348 V334 H48 Z" fill="#EFF6FF"/>
  <text x="72" y="316" class="card-title blue">使用信号</text>
  <circle cx="78" cy="365" r="6" fill="#2563EB"/>
  <text x="96" y="371" class="body bold">明确表达</text>
  <text x="96" y="395" class="small">“以后按这个格式”</text>
  <text x="96" y="417" class="small">“记住这个产品参数”</text>
  <circle cx="78" cy="451" r="6" fill="#2563EB"/>
  <text x="96" y="457" class="body bold">用户纠正</text>
  <text x="96" y="481" class="small">“别翻译，我要测试方法”</text>
  <text x="96" y="503" class="small">跨会话重复才有价值</text>
  <circle cx="78" cy="537" r="6" fill="#2563EB"/>
  <text x="96" y="543" class="body bold">当前任务</text>
  <text x="96" y="567" class="small">文档、选区、动作、追问</text>

  <path d="M348 435 H390" class="arrow"/>

  <!-- Governance -->
  <rect x="396" y="282" width="320" height="306" rx="18" fill="#FFFFFF" stroke="#FCD34D" filter="url(#shadow)"/>
  <rect x="396" y="282" width="320" height="52" rx="18" fill="#FFFBEB"/>
  <path d="M396 316 H716 V334 H396 Z" fill="#FFFBEB"/>
  <text x="420" y="316" class="card-title amber">候选提炼与写入治理</text>
  <rect x="420" y="354" width="272" height="52" rx="10" fill="#F8FAFC"/>
  <text x="436" y="377" class="body bold">明确记忆 → 用户确认</text>
  <text x="436" y="397" class="tiny">全局长期偏好不静默写入</text>
  <rect x="420" y="418" width="272" height="64" rx="10" fill="#F8FAFC"/>
  <text x="436" y="441" class="body bold">行为习惯 → 多次证据</text>
  <text x="436" y="462" class="tiny">1 次仅本次；2 次成为候选</text>
  <text x="436" y="480" class="tiny">≥3 个独立会话再建议确认</text>
  <rect x="420" y="494" width="272" height="70" rx="10" fill="#F8FAFC"/>
  <text x="436" y="518" class="body bold">LLM 只生成候选</text>
  <text x="436" y="540" class="tiny">带来源、范围、置信度、有效期</text>
  <text x="436" y="558" class="tiny">复制 / 导出等弱信号不单独成记忆</text>

  <path d="M716 435 H758" class="arrow"/>

  <!-- Store -->
  <rect x="764" y="282" width="788" height="306" rx="18" fill="#FFFFFF" stroke="#A7F3D0" filter="url(#shadow)"/>
  <rect x="764" y="282" width="788" height="52" rx="18" fill="#ECFDF5"/>
  <path d="M764 316 H1552 V334 H764 Z" fill="#ECFDF5"/>
  <text x="788" y="316" class="card-title green">本地分层记忆库</text>
  <text x="1524" y="315" class="small green" text-anchor="end">AppData · 原子写入 · 不上传整库</text>

  <rect x="788" y="354" width="232" height="202" rx="14" fill="#F0F9FF" stroke="#7DD3FC"/>
  <text x="808" y="386" font-size="19" font-weight="700" fill="#0369A1">稳定偏好</text>
  <text x="808" y="418" class="small">输出详细度与结构</text>
  <text x="808" y="442" class="small">保留英文术语</text>
  <text x="808" y="466" class="small">优先测试视角</text>
  <text x="808" y="490" class="small">表格 / 分点偏好</text>
  <rect x="808" y="514" width="152" height="26" rx="13" fill="#E0F2FE"/>
  <text x="884" y="533" class="tiny center" fill="#0369A1">全局 · 长期有效</text>

  <rect x="1042" y="354" width="232" height="202" rx="14" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="1062" y="386" font-size="19" font-weight="700" fill="#6D28D9">工作上下文</text>
  <text x="1062" y="418" class="small">产品类型 / 额定参数</text>
  <text x="1062" y="442" class="small">目标市场 / 测试阶段</text>
  <text x="1062" y="466" class="small">标准族 / 当前版本</text>
  <text x="1062" y="490" class="small">比较对象与任务</text>
  <rect x="1062" y="514" width="178" height="26" rx="13" fill="#EDE9FE"/>
  <text x="1151" y="533" class="tiny center" fill="#6D28D9">文档 / 项目 · 可清除</text>

  <rect x="1296" y="354" width="232" height="202" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="1316" y="386" font-size="19" font-weight="700" fill="#C2410C">近期任务记忆</text>
  <text x="1316" y="418" class="small">上次在做什么</text>
  <text x="1316" y="442" class="small">最近分析的条款</text>
  <text x="1316" y="466" class="small">上次输出方式</text>
  <text x="1316" y="490" class="small">未解决的问题</text>
  <rect x="1316" y="514" width="166" height="26" rx="13" fill="#FFEDD5"/>
  <text x="1399" y="533" class="tiny center" fill="#C2410C">会话 / 文档 · 自动过期</text>

  <!-- Memory to retrieval -->
  <path d="M1158 588 V626 H885 V658" class="arrow-green"/>
  <text x="1174" y="618" class="small green bold">按需读取，不整库注入</text>

  <!-- Section 2 -->
  <text x="48" y="640" class="section-title">02　一次模糊提问的运行链路</text>

  <!-- Runtime background -->
  <rect x="48" y="662" width="1504" height="258" rx="20" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#shadow)"/>

  <!-- Current request -->
  <rect x="72" y="700" width="238" height="174" rx="14" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="191" y="732" class="card-title center">当前请求上下文</text>
  <text x="94" y="766" class="small">动作：翻译 / 解读 / 提问</text>
  <text x="94" y="791" class="small">聚焦 tab、选区、页码</text>
  <text x="94" y="816" class="small">当前会话最近任务</text>
  <text x="94" y="841" class="small">本次明确指令与附件</text>
  <rect x="94" y="852" width="194" height="2" fill="#CBD5E1"/>

  <path d="M310 787 H354" class="arrow"/>

  <!-- Retrieval -->
  <rect x="360" y="700" width="254" height="174" rx="14" fill="#EFF6FF" stroke="#60A5FA"/>
  <text x="487" y="732" class="card-title center blue">硬过滤 + 排序召回</text>
  <text x="382" y="766" class="small">排除过期、禁用、冲突记忆</text>
  <text x="382" y="791" class="small">匹配动作与文档 / 项目范围</text>
  <text x="382" y="816" class="small">范围 › 相关性 › 证据 › 时间</text>
  <text x="382" y="841" class="small">只取 3–5 条，约 600 tokens</text>
  <rect x="382" y="852" width="210" height="2" fill="#BFDBFE"/>

  <path d="M614 787 H658" class="arrow"/>

  <!-- Intent -->
  <rect x="664" y="700" width="278" height="174" rx="14" fill="#F5F3FF" stroke="#A78BFA"/>
  <text x="803" y="732" class="card-title center" fill="#6D28D9">意图消歧</text>
  <text x="686" y="766" class="small">目标：分析哪个文档 / 条款？</text>
  <text x="686" y="791" class="small">任务：翻译、解释还是怎么测？</text>
  <text x="686" y="816" class="small">输出：简洁、表格或测试结构？</text>
  <rect x="686" y="834" width="234" height="28" rx="8" fill="#EDE9FE"/>
  <text x="803" y="854" class="tiny center" fill="#6D28D9">记忆是弱先验，不是新指令</text>

  <path d="M942 787 H986" class="arrow"/>

  <!-- Decision -->
  <rect x="992" y="686" width="276" height="202" rx="14" fill="#FFFBEB" stroke="#FBBF24"/>
  <text x="1130" y="718" class="card-title center amber">按可靠性决定行为</text>
  <circle cx="1016" cy="750" r="5" fill="#059669"/>
  <text x="1030" y="756" class="small">明确匹配：直接执行</text>
  <circle cx="1016" cy="786" r="5" fill="#D97706"/>
  <text x="1030" y="792" class="small">可带假设：先答并说明</text>
  <circle cx="1016" cy="822" r="5" fill="#DC2626"/>
  <text x="1030" y="828" class="small">结果差异大：只追问一句</text>
  <text x="1016" y="862" class="tiny">例如：“按当前 IEC 文档的 Clause 4.2</text>
  <text x="1016" y="880" class="tiny">继续刚才的测试要求比较”</text>

  <path d="M1268 787 H1312" class="arrow"/>

  <!-- Answer and verify -->
  <rect x="1318" y="700" width="210" height="174" rx="14" fill="#ECFDF5" stroke="#34D399"/>
  <text x="1423" y="732" class="card-title center green">回答与原文查证</text>
  <text x="1340" y="766" class="small">偏好只改变表达方式</text>
  <text x="1340" y="791" class="small">条款用 PDF Tools 查证</text>
  <text x="1340" y="816" class="small">限值 / 适用性不凭记忆</text>
  <text x="1340" y="841" class="small">回答保留页码与来源</text>
  <path d="M1350 854 H1496" stroke="#A7F3D0" stroke-width="2"/>

  <!-- Example strip -->
  <rect x="48" y="944" width="1504" height="108" rx="18" fill="#172554" filter="url(#shadow)"/>
  <text x="76" y="978" class="white" font-size="18" font-weight="700">消歧示例</text>
  <g transform="translate(200,962)">
    <rect width="396" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.10" stroke="#93C5FD" stroke-opacity="0.35"/>
    <text x="18" y="28" fill="#BFDBFE" font-size="16">“这条怎么测？”</text>
    <text x="18" y="53" class="white" font-size="15">→ 按常用结构给条件、设备、步骤、判定</text>
  </g>
  <g transform="translate(616,962)">
    <rect width="396" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.10" stroke="#93C5FD" stroke-opacity="0.35"/>
    <text x="18" y="28" fill="#BFDBFE" font-size="16">“那 4.2 呢？”</text>
    <text x="18" y="53" class="white" font-size="15">→ 延续当前文档与上一轮的比较任务</text>
  </g>
  <g transform="translate(1032,962)">
    <rect width="492" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.10" stroke="#93C5FD" stroke-opacity="0.35"/>
    <text x="18" y="28" fill="#BFDBFE" font-size="16">“这个能过吗？”</text>
    <text x="18" y="53" class="white" font-size="15">→ 产品参数仅作待确认前提，结论必须查证</text>
  </g>

  <!-- Section 3: Timing -->
  <text x="48" y="1098" class="section-title">03　两个关键时机：回答后沉淀，下一次请求前召回</text>

  <!-- Memory generation timing -->
  <rect x="48" y="1120" width="730" height="470" rx="20" fill="#FFFFFF" stroke="#FCD34D" filter="url(#shadow)"/>
  <rect x="48" y="1120" width="730" height="58" rx="20" fill="#FFFBEB"/>
  <path d="M48 1158 H778 V1178 H48 Z" fill="#FFFBEB"/>
  <text x="76" y="1157" class="card-title amber">A. 记忆生成时机</text>
  <text x="750" y="1156" class="small amber" text-anchor="end">主要在回答完成后</text>

  <path d="M102 1232 V1502" stroke="#D97706" stroke-width="3" marker-end="url(#arrowGray)"/>

  <circle cx="102" cy="1228" r="12" fill="#F59E0B"/>
  <text x="102" y="1233" class="white center" font-size="12" font-weight="700">1</text>
  <text x="140" y="1224" class="body bold">用户发送“记住 / 忘掉”</text>
  <text x="140" y="1249" class="small">立即识别；本次先作为明确指令执行</text>
  <text x="140" y="1271" class="small">长期记忆经确认后写入；忘掉则立即停用</text>

  <circle cx="102" cy="1320" r="12" fill="#94A3B8"/>
  <text x="102" y="1325" class="white center" font-size="12" font-weight="700">2</text>
  <text x="140" y="1316" class="body bold">流式输出过程中</text>
  <text x="140" y="1341" class="small">不逐 chunk 分析，不持续写入长期记忆</text>
  <rect x="140" y="1353" width="280" height="25" rx="12" fill="#F1F5F9"/>
  <text x="280" y="1371" class="tiny center">避免阻塞回答与保存半截结论</text>

  <circle cx="102" cy="1415" r="12" fill="#059669"/>
  <text x="102" y="1420" class="white center" font-size="12" font-weight="700">3</text>
  <text x="140" y="1411" class="body bold">本轮回答成功完成</text>
  <text x="140" y="1436" class="small">更新近期任务卡片；记录用户纠正与行为事件</text>
  <text x="140" y="1458" class="small">会话摘要附近可增量提炼候选，不重放全部历史</text>

  <circle cx="102" cy="1505" r="12" fill="#7C3AED"/>
  <text x="102" y="1510" class="white center" font-size="12" font-weight="700">4</text>
  <text x="140" y="1501" class="body bold">达到证据阈值 / 应用空闲时</text>
  <text x="140" y="1526" class="small">多次独立会话重复 → 候选 → 用户确认 → 长期偏好</text>
  <text x="140" y="1553" class="tiny">不生成：打开 / 滚动 PDF、单纯复制导出、模型自测、工具返回条款</text>

  <!-- Prompt orchestration timing -->
  <rect x="822" y="1120" width="730" height="470" rx="20" fill="#FFFFFF" stroke="#60A5FA" filter="url(#shadow)"/>
  <rect x="822" y="1120" width="730" height="58" rx="20" fill="#EFF6FF"/>
  <path d="M822 1158 H1552 V1178 H822 Z" fill="#EFF6FF"/>
  <text x="850" y="1157" class="card-title blue">B. 编排入提示词的时机</text>
  <text x="1524" y="1156" class="small blue" text-anchor="end">每次主模型请求发出前</text>

  <!-- Prompt assembly flow -->
  <rect x="846" y="1204" width="148" height="84" rx="12" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="920" y="1236" class="small center bold">当前请求上下文</text>
  <text x="920" y="1261" class="tiny center">选区 · tab · 会话</text>
  <path d="M994 1246 H1012" class="arrow"/>

  <rect x="1018" y="1204" width="148" height="84" rx="12" fill="#EFF6FF" stroke="#60A5FA"/>
  <text x="1092" y="1236" class="small center bold blue">本地召回</text>
  <text x="1092" y="1261" class="tiny center">过滤 · 排序 · 3–5 条</text>
  <path d="M1166 1246 H1184" class="arrow"/>

  <rect x="1190" y="1204" width="148" height="84" rx="12" fill="#F5F3FF" stroke="#A78BFA"/>
  <text x="1264" y="1236" class="small center bold" fill="#6D28D9">System Prompt</text>
  <text x="1264" y="1261" class="tiny center">角色 + 记忆 + 边界</text>
  <path d="M1338 1246 H1356" class="arrow"/>

  <rect x="1362" y="1204" width="166" height="84" rx="12" fill="#ECFDF5" stroke="#34D399"/>
  <text x="1445" y="1236" class="small center bold green">发出主模型请求</text>
  <text x="1445" y="1261" class="tiny center">解读 · 提问 · 追问</text>

  <!-- Snapshot reuse -->
  <rect x="846" y="1320" width="682" height="126" rx="14" fill="#F0F9FF" stroke="#7DD3FC"/>
  <text x="872" y="1352" class="body bold" fill="#0369A1">同一次提问：固定使用记忆快照 M1</text>
  <rect x="872" y="1372" width="138" height="44" rx="10" fill="#FFFFFF"/>
  <text x="941" y="1400" class="small center">模型第 1 轮</text>
  <path d="M1010 1394 H1050" class="arrow"/>
  <rect x="1056" y="1372" width="138" height="44" rx="10" fill="#FFFFFF"/>
  <text x="1125" y="1400" class="small center">PDF / Web 工具</text>
  <path d="M1194 1394 H1234" class="arrow"/>
  <rect x="1240" y="1372" width="138" height="44" rx="10" fill="#FFFFFF"/>
  <text x="1309" y="1400" class="small center">模型后续轮次</text>
